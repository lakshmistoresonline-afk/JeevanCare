name: JeevanCare Visual Regression CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  visual-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        options: --replSet rs0
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Initialize MongoDB Replica Set
        run: |
          npx wait-on tcp:27017
          mongosh --eval "try { rs.status(); } catch (err) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }); }"

      - name: Seed Test Dataset
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/jeevancare_test?replicaSet=rs0
          FORCE_SEED: '1'
        run: npx tsx src/seedTest.ts

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Visual Regression Snapshot Tests
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/jeevancare_test?replicaSet=rs0
        run: npx playwright test tests/e2e/visualRegression.spec.ts --project=chromium

      - name: Upload Visual Diff Artifacts on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff-failures
          path: test-results/
          retention-days: 7
