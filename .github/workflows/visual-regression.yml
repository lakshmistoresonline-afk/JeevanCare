name: JeevanCare Visual Regression CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  visual-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Seed Test Dataset
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/jeevancare_test?directConnection=true
          FORCE_SEED: '1'
        run: npx tsx src/seedTest.ts

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Visual Regression Snapshot Tests
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/jeevancare_test?directConnection=true
        run: npx playwright test tests/e2e/visualRegression.spec.ts --project=chromium

      - name: Upload Visual Diff Artifacts on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff-failures
          path: test-results/
          retention-days: 7
