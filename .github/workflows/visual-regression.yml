name: JeevanCare Visual Regression CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PAYLOAD_SECRET: 'jeevancare_ci_test_secret_key_minimum_32_chars_2026'
  DATABASE_URL: mongodb://127.0.0.1:27017/jeevancare_test?replicaSet=rs0
  NEXTAUTH_SECRET: 'jeevancare_ci_test_secret_key_minimum_32_chars_2026'

jobs:
  visual-test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Start MongoDB Replica Set (rs0)
        run: |
          docker compose -f docker-compose.test.yml up -d --wait
          docker exec jeevancare-test-mongo mongosh --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })"
          sleep 2

      - name: Seed Test Dataset
        env:
          FORCE_SEED: '1'
        run: npx tsx src/seedTest.ts

      - name: Production Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Visual Regression Snapshot Tests
        run: npx playwright test tests/e2e/visualRegression.spec.ts --project=chromium

      - name: Upload Visual Diff Artifacts on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff-failures
          path: test-results/
          retention-days: 7
