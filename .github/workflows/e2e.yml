name: JeevanCare CI/CD & Visual Regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PAYLOAD_SECRET: 'jeevancare_ci_test_secret_key_minimum_32_chars_2026'
  DATABASE_URL: mongodb://127.0.0.1:27017/jeevancare_test?replicaSet=rs0
  NEXTAUTH_SECRET: 'jeevancare_ci_test_secret_key_minimum_32_chars_2026'

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Start MongoDB Replica Set (rs0)
        run: |
          docker compose -f docker-compose.test.yml up -d --wait
          docker exec jeevancare-test-mongo mongosh --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })"
          sleep 2

      - name: Seed Test Dataset
        env:
          FORCE_SEED: '1'
        run: npx tsx src/seedTest.ts

      - name: Run Unit Tests
        run: npx vitest run tests/unit/

      - name: Run Integration Tests
        run: npx vitest run tests/int/ --fileParallelism=false

      - name: Production Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E & Visual Regression Tests
        run: npx playwright test --project=chromium

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Linter Check
        run: npm run lint
