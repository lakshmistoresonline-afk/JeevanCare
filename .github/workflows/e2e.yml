name: JeevanCare CI/CD & Visual Regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npx vitest run tests/unit/

      - name: Run Integration Tests
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/jeevancare_test?directConnection=true
        run: npx vitest run tests/int/ --fileParallelism=false

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E & Visual Regression Tests
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/jeevancare_test?directConnection=true
        run: npx playwright test --project=chromium

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Linter Check
        run: npm run lint

      - name: Production Build
        run: npm run build
