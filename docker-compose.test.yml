services:
  mongodb:
    image: mongo:7.0
    container_name: jeevancare-test-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_test:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ping:1})' --port 27017 --quiet"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data_test:
